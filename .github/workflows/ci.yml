name: CI

on:
  pull_request:

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install bats-core, shellcheck, and zsh (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y bats shellcheck zsh

      - name: Install bats-core, shellcheck, and a modern bash (macOS)
        if: runner.os == 'macOS'
        # macOS ships bash 3.2 (no associative arrays), which
        # lib/switcher.bash's cleanup tracking relies on.
        run: |
          brew install bats-core shellcheck bash
          echo "/opt/homebrew/bin" >> "$GITHUB_PATH"

      - name: Lint
        run: make lint

      - name: Test
        run: make test
